<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>행운을 당신에게~</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  font-family:"Jua","Malgun Gothic",sans-serif;color:#5a3e6b;
  background:radial-gradient(circle at 15% 10%,#ffe3f1 0,transparent 40%),radial-gradient(circle at 88% 85%,#dff3ff 0,transparent 42%),#fff8fc}
.box{width:100%;max-width:360px;background:#fffdf8;border:3px solid #ffd6e7;border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 8px 0 rgba(255,143,184,.25)}
.cat{font-size:64px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(5deg)}}
h1{margin:6px 0 4px;font-size:1.7rem;font-weight:400;background:linear-gradient(90deg,#ff8fb8,#c4a8ff,#8ec5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 0 16px;color:#9a82a8;font-size:.9rem}
input[type=password]{width:100%;font:inherit;font-size:1.05rem;padding:12px 16px;border:3px solid #ffd6e7;border-radius:999px;outline:none;text-align:center;color:#5a3e6b;background:#fff}
input[type=password]:focus{border-color:#ff8fb8}
button{margin-top:14px;width:100%;font:inherit;font-size:1.05rem;color:#fff;background:#ff8fb8;border:0;border-radius:999px;padding:11px;cursor:pointer;box-shadow:0 5px 0 #e0709a}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #e0709a}
button:disabled{opacity:.6;cursor:wait}
label{display:block;margin-top:12px;font-size:.85rem;color:#9a82a8;cursor:pointer}
#msg{min-height:1.4em;margin-top:10px;font-size:.9rem;color:#e0506f}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head>
<body>
<form class="box" id="f">
  <div class="cat">🐱</div>
  <h1>행운을 당신에게~</h1>
  <p>비밀번호를 알려 준 분만 들어올 수 있어요</p>
  <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" autofocus>
  <label><input type="checkbox" id="rem"> 이 기기에서 기억하기</label>
  <button id="go">열기 🍀</button>
  <div id="msg" aria-live="polite"></div>
</form>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function open(pw) {
  const raw = b64(P), salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);

}
async function tryOpen(pw, remember) {
